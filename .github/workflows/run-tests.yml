name: Test package

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ 'ubuntu-latest', 'macos-latest' ]
        python-version: [ '3.10', '3.14' ]
        force-copy: [ false ]
        include:
          - os: 'ubuntu-latest'
            python-version: '3.14'
            force-copy: true

    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ case(matrix.force-copy, 'force copy', 'default build') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Get latest CMake
        uses: lukka/get-cmake@latest

      - name: Inject fetch-copy compilation flags
        if: ${{ matrix.os.force-copy }}
        run: |
            cat setup.py | sed "s/#\"-DFORCE_COPY/\"-DFORCE_COPY/" > tmp
            mv tmp setup.py

      - name: Extract examples from docstrings
        run: |
          echo "def test_docstrings():" > tests/test_docstrings.py
          cat src/mattress/*.py | sed "s/^/#/" | sed "s/^# *>>> /    /" >> tests/test_docstrings.py

      - name: Test with tox
        run: |
          pip install tox
          tox -vvv
